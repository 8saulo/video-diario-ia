name: Vídeo diário
run-name: "${{ inputs.refazer && format('Refazer #{0}', inputs.refazer) || 'Vídeo diário' }}"

on:
  schedule:
    # Todo dia às 01:47 de Brasília (04:47 UTC). O cron do GitHub é sempre em UTC (Brasília = UTC−3).
    # O GitHub não garante o horário (já atrasou 7–10 h); minuto "quebrado" costuma atrasar menos que o :00.
    # O PC (rodar_diario.ps1) dispara esta rotina às 05:00 UTC; se ela já rodou no dia, o agendado é pulado.
    # Para mudar o horário, edite a linha abaixo.
    - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "completo = pesquisa + roteiro + vídeo | demo = só testa motor, voz e render"
        type: choice
        options: [completo, demo]
        default: completo
      tema:
        description: "Tema fixo (opcional; pula a pesquisa no YouTube)"
        type: string
        default: ""
      formato:
        description: "Formato (vazio = o do config.yml)"
        type: choice
        options: ["", longo, curto]
        default: curto
      duracao:
        description: "Duração: minutos (longo) ou segundos (curto). Vazio = config.yml"
        type: string
        default: 70
      narracao:
        description: "auto = Google AI Studio e, se falhar, edge-tts"
        type: choice
        options: ["", auto, gemini, edge]
        default: ""
      voz:
        description: "Voz (ex.: Charon, Kore, Puck ou pt-BR-FranciscaNeural). Vazio = config.yml"
        type: string
        default: ""
      buscas:
        description: "Buscas extras em inglês, separadas por ;"
        type: string
        default: ""
      refazer:
        description: "Refazer um vídeo anterior: número da execução (ex.: 11). Reaproveita roteiro e fatos; refaz narração e render"
        type: string
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: video-diario
  cancel-in-progress: false

jobs:
  checar:
    # o agendado só roda se ainda não houve vídeo do dia (ex.: disparado pelo PC às 05:00 UTC)
    runs-on: ubuntu-latest
    outputs:
      pular: ${{ steps.c.outputs.pular }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "pular=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          hoje=$(TZ=America/Sao_Paulo date +%F)
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow video-diario.yml --limit 40                 --json databaseId,displayTitle,createdAt,status,conclusion                 -q "[.[] | select(.databaseId != $GITHUB_RUN_ID)
                         | select((.displayTitle | startswith(\"Refazer\")) | not)
                         | select((.createdAt | fromdate - 10800 | strftime(\"%Y-%m-%d\")) == \"$hoje\")
                         | select(.status != \"completed\" or .conclusion == \"success\")] | length")
          echo "execuções do dia $hoje já feitas ou em andamento: $n"
          if [ "$n" -gt 0 ]; then echo "pular=1" >> "$GITHUB_OUTPUT"; else echo "pular=0" >> "$GITHUB_OUTPUT"; fi

  video:
    needs: checar
    if: needs.checar.outputs.pular != '1'
    runs-on: ubuntu-24.04   # fixo: o Playwright fixado suporta 24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Cache de modelos (Playwright e Whisper)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/huggingface
          key: modelos-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Baixar o vídeo a refazer
        if: ${{ inputs.refazer != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ inputs.refazer }}
        run: |
          id=$(gh run list --workflow video-diario.yml --limit 300 --json number,databaseId -q ".[] | select(.number == $N) | .databaseId")
          test -n "$id" || { echo "execução #$N não encontrada"; exit 1; }
          gh run download "$id" -n "video-$N" -D refazer
          ls refazer

      - name: Testes de regressão
        run: |
          pip install pytest==8.3.5
          python -m pytest -q -m "not lento"

      - name: Gerar vídeo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          IN_MODO: ${{ inputs.modo || 'completo' }}
          IN_TEMA: ${{ inputs.tema }}
          IN_FORMATO: ${{ inputs.formato }}
          IN_DURACAO: ${{ inputs.duracao }}
          IN_NARRACAO: ${{ inputs.narracao }}
          IN_VOZ: ${{ inputs.voz }}
          IN_BUSCAS: ${{ inputs.buscas }}
          IN_REFAZER: ${{ inputs.refazer != '' && 'refazer' || '' }}
        run: |
          python -m videobot run --modo "$IN_MODO" --tema "$IN_TEMA" --formato "$IN_FORMATO" \
            --duracao "$IN_DURACAO" --narracao "$IN_NARRACAO" --voz "$IN_VOZ" --buscas "$IN_BUSCAS" \
            --refazer "$IN_REFAZER"

      - name: Guardar arquivos da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: saida/
          retention-days: 14
          if-no-files-found: ignore

      - name: Publicar Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess, yaml
          cfg = yaml.safe_load(open("config.yml", encoding="utf-8"))
          if not cfg.get("entrega", {}).get("release", True):
              raise SystemExit(0)
          s = json.load(open("saida/ultimo.json", encoding="utf-8"))
          pasta = s["pasta"]
          import glob, os
          arquivos = [s["video"]] + ([s["previa"]] if s["previa"] else []) + s["thumbs"] + [s["publicacao"]]
          for extra in ("pesquisa.md", "fatos.md", "previa_crivo5.png", "folha_crivo6.png", "roteiro.json"):
              p = os.path.join(pasta, extra)
              if os.path.exists(p):
                  arquivos.append(p)
          tag = s["tag"] + ("-demo" if s["modo"] == "demo" else "")
          cmd = ["gh", "release", "create", tag, *arquivos, "--title", ("[demo] " if s["modo"] == "demo" else "") + s["titulo"],
                 "--notes-file", s["relatorio"]]
          if s["modo"] == "demo":
              cmd.append("--prerelease")
          subprocess.run(["gh", "release", "delete", tag, "--yes", "--cleanup-tag"], check=False)
          subprocess.run(cmd, check=True)
          PY

      - name: Salvar histórico de temas
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico/temas.json
          git diff --cached --quiet || (git commit -m "Histórico: tema de $(date -u +%F)" && git push)

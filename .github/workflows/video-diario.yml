name: Vídeo diário

on:
  schedule:
    # Todo dia às 06:17 de Brasília (09:17 UTC). O cron do GitHub é sempre em UTC (Brasília = UTC−3).
    # Para mudar o horário, edite a linha abaixo.
    - cron: "00 5 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "completo = pesquisa + roteiro + vídeo | demo = só testa motor, voz e render"
        type: choice
        options: [completo, demo]
        default: completo
      tema:
        description: "Tema fixo (opcional; pula a pesquisa no YouTube)"
        type: string
        default: ""
      formato:
        description: "Formato (vazio = o do config.yml)"
        type: choice
        options: ["", longo, curto]
        default: curto
      duracao:
        description: "Duração: minutos (longo) ou segundos (curto). Vazio = config.yml"
        type: string
        default: 70
      narracao:
        description: "auto = Google AI Studio e, se falhar, edge-tts"
        type: choice
        options: ["", auto, gemini, edge]
        default: ""
      voz:
        description: "Voz (ex.: Charon, Kore, Puck ou pt-BR-FranciscaNeural). Vazio = config.yml"
        type: string
        default: ""
      buscas:
        description: "Buscas extras em inglês, separadas por ;"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: video-diario
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-24.04   # fixo: o Playwright fixado suporta 24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Cache de modelos (Playwright e Whisper)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/huggingface
          key: modelos-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Gerar vídeo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          IN_MODO: ${{ inputs.modo || 'completo' }}
          IN_TEMA: ${{ inputs.tema }}
          IN_FORMATO: ${{ inputs.formato }}
          IN_DURACAO: ${{ inputs.duracao }}
          IN_NARRACAO: ${{ inputs.narracao }}
          IN_VOZ: ${{ inputs.voz }}
          IN_BUSCAS: ${{ inputs.buscas }}
        run: |
          python -m videobot run --modo "$IN_MODO" --tema "$IN_TEMA" --formato "$IN_FORMATO" \
            --duracao "$IN_DURACAO" --narracao "$IN_NARRACAO" --voz "$IN_VOZ" --buscas "$IN_BUSCAS"

      - name: Guardar arquivos da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: saida/
          retention-days: 14
          if-no-files-found: ignore

      - name: Publicar Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess, yaml
          cfg = yaml.safe_load(open("config.yml", encoding="utf-8"))
          if not cfg.get("entrega", {}).get("release", True):
              raise SystemExit(0)
          s = json.load(open("saida/ultimo.json", encoding="utf-8"))
          pasta = s["pasta"]
          import glob, os
          arquivos = [s["video"]] + ([s["previa"]] if s["previa"] else []) + s["thumbs"] + [s["publicacao"]]
          for extra in ("pesquisa.md", "fatos.md", "previa_crivo5.png", "folha_crivo6.png", "roteiro.json"):
              p = os.path.join(pasta, extra)
              if os.path.exists(p):
                  arquivos.append(p)
          tag = s["tag"] + ("-demo" if s["modo"] == "demo" else "")
          cmd = ["gh", "release", "create", tag, *arquivos, "--title", ("[demo] " if s["modo"] == "demo" else "") + s["titulo"],
                 "--notes-file", s["relatorio"]]
          if s["modo"] == "demo":
              cmd.append("--prerelease")
          subprocess.run(["gh", "release", "delete", tag, "--yes", "--cleanup-tag"], check=False)
          subprocess.run(cmd, check=True)
          PY

      - name: Salvar histórico de temas
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico/temas.json
          git diff --cached --quiet || (git commit -m "Histórico: tema de $(date -u +%F)" && git push)

# ---------------- PAUTAS (tema marcado para um dia) ----------------
# Vale para a rotina daquele dia (agendada ou disparada pelo PC) quando ela não traz tema próprio.
# formatos: [curto, longo] gera os dois (um job do GitHub para cada). "config" sobrepõe o resto deste arquivo só nesse dia.
pautas:
  "2026-11-24":                     # vídeo avulso pedido pelo usuário: o caminho da internet (modelo do resto da série)
    tema: "O caminho da internet até a casa do cliente"
    formatos: [curto]
    roteiro_fixo: roteiros/2026-11-24_caminho_da_internet.json
    config:
      tema:
        nicho: "Caminho da internet"
      visual:
        paleta: redes
        cena3d: rota
  "2026-11-23":                     # vídeo avulso de Wi-Fi: uma ilustração contínua da casa (engine/planta.js), fora da série
    tema: "Wi-Fi em casa: do problema à solução com rede mesh"
    formatos: [curto]
    roteiro_fixo: roteiros/2026-11-23_wifi_mesh.json   # storyboard do usuário (3D -> planta 2D -> 3D)
    buscas_fatos: ["wifi signal attenuation through walls dB", "2.4 GHz vs 5 GHz range walls", "how mesh wifi works backhaul", "mesh wifi node placement"]
    angulo: >-
      Para o usuário comum, em casa: por que o Wi-Fi enfraquece de um cômodo para o outro (distância, paredes,
      espelhos, metal, micro-ondas), a diferença de 2,4 e 5 GHz, e como a rede mesh resolve com vários pontos
      conversando entre si e um nome de rede só. Termine com onde colocar o roteador e os pontos.
    config:
      tema:
        nicho: "Wi-Fi em casa"
      visual:
        paleta: redes
        cena3d: planta
      roteiro:
        estilo: educativo
        cenas_curto: [12, 15]
        so_planta: true
        notas: >-
          Público: usuário residencial, sem jargão (explique o termo técnico na hora em que ele aparece).
          O vídeo inteiro é UMA ilustração contínua da casa vista de cima (template planta): cada cena escolhe o
          passo que mostra exatamente o que a frase explica, na ordem em que a história avança. Sequência sugerida:
          casa -> ondas -> paredes -> obstaculos -> distancia -> zona_morta -> bandas -> interferencia -> mesh ->
          backhaul -> roaming -> posicionamento -> cta. O titulo de cada cena descreve o que aparece (até 7 palavras).
          Nada de marca de roteador. Vídeo avulso: não é episódio de série; não diga "no próximo vídeo".
  "2026-11-22":
    tema: "O IPO da Anthropic"
    formatos: [curto, longo]
    angulo: >-
      Explicar com fatos verificados o IPO da Anthropic, a empresa que criou o Claude e o Claude Code: em que pé ele está,
      quanto a empresa vale e fatura, por que abrir capital agora e o que isso muda no mercado de IA.
    financas: true
    buscas_fatos:

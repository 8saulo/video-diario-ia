      - Anthropic IPO filing bankers
      - Anthropic valuation 2026
      - Anthropic annual revenue run rate
      - Anthropic funding round investors
      - Claude Code revenue growth
      - OpenAI IPO plans
    config:
      duracao:
        curto_seg: 75
        longo_min: 9
      roteiro:
        estilo: educativo
        notas: >-
          - O tema é o IPO (oferta pública inicial de ações) da Anthropic, a empresa que criou o Claude e o Claude Code.
          Explique o que é um IPO na introdução, em uma frase simples.
          - Diga o status do IPO exatamente como os fatos mostram (rumor, preparação, pedido protocolado, data marcada ou já
          realizado). Se os fatos não confirmam que ele aconteceu, não diga que aconteceu.
          - Conte como enredo: a origem da empresa, como ela cresceu (Claude, Claude Code, clientes), quanto vale e fatura,
          por que abrir capital agora, os riscos (custo de computação, concorrência com OpenAI e Google, regulação) e o que
          observar daqui para a frente. Use só o que os fatos sustentam.
          - Explique valor de mercado, receita anual e rodada de investimento quando aparecerem.
          - Na conclusão, diga "isto não é recomendação de investimento".

# Configuração do vídeo diário. Tudo aqui pode ser sobrescrito na hora de rodar
# (GitHub → Actions → "Vídeo diário" → Run workflow) ou pela linha de comando:
#   python -m videobot run --tema "chips de IA" --formato curto --narracao edge

# ---------------- TEMA E PESQUISA ----------------
tema:
  nicho: "tecnologia e TI"          # assunto geral do canal; no dia vira o rótulo da categoria sorteada
  tema_fixo: ""                     # se preencher, pula a pesquisa no YouTube e usa este tema
  buscas:                           # buscas gerais de tecnologia (somadas às da categoria do dia; total ≥ 12)
    - tech news this week
    - new technology explained
    - how it works animation
    - tech explained in 60 seconds
    - technology innovation 2026
    - engineering explained animation
  buscas_extras: []                 # somadas às de cima (ex.: notícias do dia)
  janela_dias: 15                   # CRIVO 1: só vídeos publicados nos últimos N dias
  nao_repetir_dias: 7               # veta tema usado nos últimos N dias (historico/temas.json)
  nao_repetir_categoria_dias: 2     # a categoria sorteada não pode ter saído nos últimos N dias
  assuntos_cansados:                # assuntos que saturaram o canal: vetados por mais tempo
    dias: 30
    termos: [energia, energetico, eletricidade, "conta de luz", "data center", "data centers", "consumo de agua"]
  candidatos_por_busca: 20
  # Categorias sorteadas a cada dia (peso = chance relativa). A pesquisa do YouTube usa as buscas da
  # categoria; a triagem descarta o que for de outra categoria; a reserva começa pelos temas dela.
  categorias:
    redes:
      rotulo: "Redes e internet"
      peso: 2
      palavras: [rede, redes, internet, wifi, 5g, 6g, fibra, ftth, gpon, cabo, cabos, roteador, dns, bgp, ipv4, ipv6, tcp, udp, starlink, telecom, latencia, provedor, ping]
      buscas: [computer networking explained, how the internet works animation, submarine internet cables, fiber optic internet explained, 5G explained, Wi-Fi 7 explained, DNS explained, Starlink satellites explained, network latency explained, how routers work]
      temas_reserva:
        - "Cabos submarinos: a internet passa pelo fundo do mar"
        - "Como um pacote de dados atravessa o mundo"
        - "DNS: a lista telefônica da internet"
        - "Fibra óptica: como a luz carrega a internet"
        - "Wi-Fi 7: o que muda na sua casa"
        - "5G no Brasil: onde já funciona de verdade"
        - "Starlink: como funciona a internet por satélite"
        - "Ping e latência: por que o jogo trava"
        - "IPv4 acabou: como a internet sobrevive"
        - "O dia em que um erro de BGP derrubou o Facebook"
        - "Como funciona um provedor de internet por dentro"
        - "TCP e UDP: as duas formas de mandar dados"
    robos:
      rotulo: "Robôs"
      peso: 2
      palavras: [robo, robos, robotica, humanoide, humanoides, optimus, atlas, drone, drones, exoesqueleto]
      buscas: [humanoid robots news, robotics explained, Boston Dynamics Atlas, Tesla Optimus update, warehouse robots, robot dog explained, surgical robots, delivery drones explained, robot hands dexterity]
      temas_reserva:
        - "Robôs humanoides nas fábricas: quantos já trabalham"
        - "Robôs cirurgiões: como operam com precisão"
        - "Robôs de armazém: como a Amazon entrega tão rápido"
        - "Cães robôs: para que servem de verdade"
        - "Drones de entrega: por que ainda são raros"
        - "Mão robótica: por que segurar um ovo é difícil"
        - "Exoesqueletos: robôs que fazem pessoas andar"
        - "Robôs aspiradores: como mapeiam sua casa"
    carros:
      rotulo: "Carros autônomos e elétricos"
      peso: 2
      palavras: [carro, carros, autonomo, autonomos, waymo, tesla, veiculo, veiculos, eletrico, eletricos, bateria, baterias, lidar, robotaxi, robotaxis, byd]
      buscas: [self-driving cars explained, Waymo robotaxi, Tesla FSD update, electric car battery explained, lidar explained, solid state battery, EV charging explained, autonomous trucks]
      temas_reserva:
        - "Robotáxis: quantas corridas já rodam sem motorista"
        - "Lidar: como o carro autônomo enxerga"
        - "Níveis de direção autônoma: do 0 ao 5"
        - "Bateria de estado sólido: o que muda nos carros"
        - "Carro elétrico: quanto tempo dura a bateria"
        - "Caminhões autônomos nas estradas"
        - "Recarga rápida: como encher a bateria em minutos"
        - "Carros chineses: como a BYD cresceu tão rápido"
    espaco:
      rotulo: "Foguetes e espaço"
      peso: 2
      palavras: [foguete, foguetes, starship, spacex, nasa, espaco, espacial, orbita, lua, marte, satelite, satelites, artemis, telescopio]
      buscas: [SpaceX Starship launch, rocket explained animation, reusable rockets explained, Artemis moon mission, Mars mission news, satellite constellation explained, James Webb telescope discovery, space station news]
      temas_reserva:
        - "Foguete reutilizável: como ele pousa de pé"
        - "Starship: o maior foguete já construído"
        - "Artemis: a volta do ser humano à Lua"
        - "Quanto custa mandar 1 kg para a órbita"
        - "Lixo espacial: o trânsito em volta da Terra"
        - "Telescópio James Webb: o que já descobriu"
        - "Quanto tempo leva uma viagem até Marte"
        - "Brasil no espaço: Alcântara e os satélites nacionais"
    novidades:
      rotulo: "Notícias de tecnologia"
      peso: 2
      palavras: [lancamento, novidade, novidades, anuncio, apple, iphone, samsung, galaxy, google, microsoft, ces, gadget, gadgets, invencao, invencoes, oculos, dobravel]
      buscas: [biggest tech news this week, new gadgets 2026, tech announcements, CES highlights, Apple event recap, Samsung new phone, weird new technology, inventions that will change the world]
      temas_reserva:
        - "As invenções de tecnologia mais curiosas do ano"
        - "Tecnologias que prometiam e sumiram"
        - "Óculos inteligentes: o próximo celular?"
        - "Tela dobrável: quanto ela aguenta"
        - "Impressão 3D de casas: já é real"
        - "Como funciona o GPS"
        - "Como o celular sabe onde você está"
    ciberseguranca:
      rotulo: "Cibersegurança"
      peso: 1.5
      palavras: [hacker, hackers, ataque, ataques, senha, senhas, golpe, golpes, ransomware, phishing, vazamento, vazamentos, seguranca, virus, malware, criptografia]
      buscas: [cybersecurity explained, biggest hacks explained, ransomware attack explained, how hackers steal passwords, phishing explained, data breach news, encryption explained animation]
      temas_reserva:
        - "Ransomware: o sequestro de dados de empresas"
        - "Como uma senha é quebrada"
        - "Phishing: o golpe que começa num e-mail"
        - "Criptografia de ponta a ponta: como funciona"
        - "Os maiores vazamentos de dados da história"
        - "Autenticação em dois fatores: por que importa"
        - "Golpe do Pix: como os criminosos agem"
    hardware:
      rotulo: "Chips e hardware"
      peso: 1.5
      palavras: [chip, chips, processador, processadores, nvidia, intel, amd, tsmc, semicondutor, semicondutores, transistor, transistores, gpu, cpu, ssd]
      buscas: [how computer chips are made, semiconductor explained, transistor explained animation, TSMC explained, CPU vs GPU explained, how SSD works, Moore law explained]
      temas_reserva:
        - "Como se fabrica um chip de 3 nanômetros"
        - "CPU e GPU: qual a diferença de verdade"
        - "TSMC: a fábrica de que o mundo depende"
        - "Lei de Moore: ainda vale?"
        - "SSD e HD: por que um é tão mais rápido"
        - "Quantos transistores cabem num celular"
    software:
      rotulo: "Software e programação"
      peso: 1
      palavras: [software, programacao, programar, codigo, linux, windows, nuvem, cloud, app, apps, bug, bugs, open source]
      buscas: [programming explained animation, how software works, Linux explained, cloud computing explained, biggest software bugs, open source explained, how apps make money]
      temas_reserva:
        - "Os bugs de software mais caros da história"
        - "Linux: o sistema que roda o mundo sem você ver"
        - "Nuvem: onde ficam suas fotos de verdade"
        - "Open source: código grátis que move bilhões"
        - "O bug do milênio: o que aconteceu de fato"
        - "Como funciona o Pix por dentro"
    quantica:
      rotulo: "Computação quântica"
      peso: 0.7
      palavras: [quantica, quantico, quanticos, qubit, qubits]
      buscas: [quantum computing explained, quantum computer news, qubits explained animation, quantum supremacy, quantum computer explained simply, IBM quantum news, Google quantum chip]
      temas_reserva:
        - "Computação quântica: o que já é real"
        - "Qubit: como um bit pode ser 0 e 1 ao mesmo tempo"
        - "Computador quântico quebra senhas?"
    ia:
      rotulo: "Inteligência artificial"
      peso: 1.2
      palavras: [ia, ias, inteligencia, chatgpt, openai, anthropic, claude, gemini, llm, agente, agentes, deepfake, deepfakes, altman]
      buscas: [AI news, AI explained animation, AI agents explained, open source AI models, AI in medicine, AI breakthroughs explained]
      temas_reserva:
        - "Agentes de IA: o que já funciona de verdade"
        - "Alucinações: por que a IA inventa respostas"
        - "IA na medicina: diagnósticos que já acertam"
        - "Golpes com voz clonada por IA"
        - "IA que programa: quanto código ela já escreve"
        - "Modelos de IA abertos vs fechados"
        - "Direitos autorais e imagens geradas por IA"
        - "Tradução por IA: o fim da barreira do idioma"
  temas_reserva:                    # reserva geral (quando a da categoria do dia esgota)
    - "O que acontece quando você aperta Enter numa busca"
    - "QR Code: como ele guarda informação"
    - "Bluetooth: como dois aparelhos se encontram"
    - "Como funciona o reconhecimento facial do celular"

# ---------------- FORMATO ----------------
formato: curto                      # longo (16:9, capítulos) | curto (9:16, Shorts/TikTok)
longo_semanal: domingo              # a rotina também faz um longo neste dia da semana ("" desliga)
duracao:
  longo_min: 7                      # alvo em minutos (o prompt aceita 6 a 10)
  curto_seg: 65                     # alvo em segundos (55 a 75)
idioma: pt-BR

# ---------------- NARRAÇÃO (único uso do Gemini por padrão) ----------------
narracao:
  provedor: auto                    # auto = Google AI Studio (Gemini TTS) e, só se falhar, edge-tts | gemini | edge
  gemini_voz: Charon                # Charon (masculina), Kore (feminina), Puck, Fenrir, Aoede, Orus...
  # voz padrão de TODOS os vídeos (aprovada no capítulo 2 do longo do IPO da Anthropic, 22/11); a emoção de cada cena
  # vem da tag do roteiro (script.EMOCOES_PADRAO, conferida em código por emocoes_coerentes)
  direcao: >-
    Narre como um apresentador brasileiro de telejornal de economia e tecnologia contando uma boa história: voz grave,
    segura e calorosa; interesse genuíno pelo assunto; entonação expressiva e humana, com subidas e descidas naturais
    (curiosidade nas perguntas, peso nos números, leve sorriso nas viradas positivas, gravidade nos riscos); ritmo que
    varia com a ideia, com pausas curtas para o espectador absorver. Expressivo, mas sem exagero: nada teatral,
    eufórico ou de locutor de propaganda; nunca robótico nem monótono.
  gemini_modelos_preferidos:        # ordem de tentativa; o script também descobre os modelos TTS da sua chave
    - flash-preview-tts
    - flash-tts
    - pro-preview-tts
    - tts
  edge_voz: pt-BR-AntonioNeural     # alternativa: pt-BR-FranciscaNeural
  edge_velocidade: "+0%"            # mesmo ritmo do Gemini (voz padrão)
  pronuncia:                        # só muda o que a voz fala; a legenda mantém o termo original
    GPON: Gêpon
    ONU: Ó-Ene-U                    # letra por letra
    IPO: aipiou                     # sigla em inglês, como se fala no mercado
    Anthropic: Antrópic             # an-THRÓ-pic
    Claude: Clód                    # o modelo da Anthropic (inglês: "clód")
    DIO: Dê-I-Ó                     # soletrado (distribuidor interno óptico)
    CEO: Céu                        # caixa de emenda óptica: "CÉO" (com "Céo" a voz lia "ceó")
    CTO: Cê-Tê-Ó                    # soletrado (caixa de terminação óptica)
    OLT: Ó-Éle-Tê                   # soletrado
    dBm: dê-bê-ême

# ---------------- VISUAL ----------------
visual:
  fps: 30
  paleta: rodizio                   # rodizio = alterna a cada vídeo publicado | laranja | roxo | azul | fixa = usa acento/acento2 abaixo
  paletas:                          # cores de cada paleta (acento = principal, acento2 = legenda ativa, acento_suave = barra de progresso)
    laranja:
      acento: "#ff4f12"
      acento2: "#d4ff3a"
      acento_suave: "#ff8a52"
    roxo:                           # roxo cibernético
      acento: "#a64dff"
      acento2: "#3df5ff"
      acento_suave: "#c993ff"
    azul:                           # azul cibernético
      acento: "#1f8bff"
      acento2: "#ff4fd8"
      acento_suave: "#6cb6ff"
    redes:                          # série "Redes na Prática": ciano de fibra + verde de terminal (fixa; fora do rodízio)
      rodizio: false
      acento: "#19c3ff"
      acento2: "#3dff9a"
      acento_suave: "#7fdcff"
    claude:                         # cores da Claude / Anthropic / Claude Code (terracota, creme, grafite quente, azul)
      rodizio: false                # só quando pedida (ex.: pauta); não entra no rodízio diário
      acento: "#d97757"
      acento2: "#6a9bcc"
      acento_suave: "#e3a68a"
      tokens:                       # cores de base: fundo, cartões e textos
        ink-950: "#0e0e0d"
        ink-900: "#141413"
        ink-850: "#1a1a18"
        ink-800: "#1f1e1d"
        ink-700: "#2a2926"
        ink-600: "#3a3935"
        ink-500: "#4a4944"
        ink-400: "#6b6a63"
        fog-50: "#faf9f5"
        fog-200: "#e8e6dc"
        fog-400: "#b0aea5"
        fog-600: "#87867f"
        bg-rgb: "20,20,19"
  fundo: ""                         # "" = estúdio escuro | terminal = sessão de terminal digitando no fundo (vibe code)
  acento: "#ff4f12"                 # laranja (cor principal; só vale com paleta: fixa)
  acento2: "#d4ff3a"                # volt (destaques e legenda ativa; só vale com paleta: fixa)
  marca: ""                         # texto discreto no canto (ex.: @seucanal); vazio = nada
  marca_logo: "assets/logo_marca.png"  # marca d'água em imagem (PNG transparente); vazio = sem logo
  marca_opacidade: 0.5              # 0 a 1; 0.5 = discreta
  marca_troca_s: 9                  # a logo troca de canto a cada N segundos
  final_seguir:                     # cena final de TODO vídeo: animação de seguir/se inscrever
    ativo: true
    dur: 4.2                        # segundos
    titulo: "Gostou? Então siga!"
    sub: "Vídeo novo todo dia"
    redes: [youtube, instagram, tiktok]
    perfis:                         # @ de cada rede (aparece embaixo do nome); vazio = só o nome da rede
      youtube: "@sauloconectati"
      instagram: "@sauloconectati"
      tiktok: "@sauloconectati"
  cena3d: "tema"                    # "tema" = objetos 3D em código escolhidos para cada cena (foguete, chip, moedas...); "gpon" = cena fixa de fibra óptica; vazio = fundo 2D
  escala3d: 0.75                    # resolução interna do 3D (menor = render mais rápido)
  quadro: true                      # quadro de dossiê por cena: pessoas, logos, fotos/vídeos em polaroide, recorte de jornal, post-it
  escala3d_longo: 1.0               # vídeo longo (16:9): 3D em resolução cheia (mais nítido; o render demora mais)
  legendas: true
  musica: true                      # trilha baixinha por baixo da voz (abaixa sozinha quando a voz entra)
  musica_real:                      # faixa real de licença livre (Openverse: Jamendo, ccMixter...); sem resultado, usa a trilha em código
    ativo: true
    buscas: [electronic, ambient, chillout, cinematic]  # buscas curtas funcionam melhor; troca a cada dia
  efeitos: true                     # whoosh/pop gerados em código
  workers: 0                        # 0 = um por núcleo de CPU

# ---------------- TEXTO: triagem, fatos e roteiro (IAs grátis) ----------------
# Cada provedor precisa da sua chave no ambiente (GitHub: Secrets; PC: setx). Sem chave, ele é pulado.
#   groq → GROQ_API_KEY (console.groq.com) · openrouter → OPENROUTER_API_KEY (openrouter.ai, só modelos :free)
#   gemini → GEMINI_API_KEY (opcional; por padrão o Gemini fica só com a voz)
llm:
  ordem:                            # provedores tentados em ordem; se um esgota a cota, passa para o próximo
    - groq
    - openrouter
    - github                        # GitHub Models: grátis, só no GitHub Actions (token da execução)
  limites_dia:                      # pedidos por dia em que o provedor é poupado (planos grátis); 0 = sem limite
    openrouter: 45                  # o grátis do OpenRouter corta em 50/dia
    github: 140                     # o grátis do GitHub Models corta em ~150/dia nos modelos menores
  cache_dias: 7                     # respostas válidas da IA ficam guardadas (refazer um vídeo não gasta cota)
  groq:
    modelos:                        # preferidos primeiro (nome ou trecho do nome); depois os outros da sua chave
      - gpt-oss-120b
      - qwen
      - gpt-oss-20b
  openrouter:
    modelos:                        # só os gratuitos (:free) entram; os gigantes grátis costumam travar, por isso vêm depois
      - nemotron-3-nano
      - gemma-4
      - gpt-oss
      - deepseek
  visao:
    modelos:                        # modelos grátis do OpenRouter que enxergam imagem (escolha de fotos/vídeos)
      - nemotron-3.5-super-vl       # o que mais respondeu nos testes
      - particle-1
      - gemma-4-31b
      - gemma-4-26b
  gemini:
    modelos:                        # só é usado para texto se "gemini" estiver na ordem acima
      - gemini-3.8-flash
      - flash
  modelos_por_provedor: 6           # quantos modelos de cada provedor tentar antes de passar ao próximo
  max_tokens: 8000                  # tamanho máximo da resposta
  espera_max_s: 65                  # se a cota pede para esperar mais que isso, pula o modelo
  rodadas: 3                        # se todos recusarem por limite por minuto, espera 60s e tenta a lista de novo
  min_fontes: 3                     # CRIVO 3: fontes confiáveis distintas, conferidas por download

# ---------------- BUSCA NA WEB (fontes dos fatos) ----------------
busca:
  provedores:                       # só APIs oficiais. tavily: TAVILY_API_KEY (tavily.com) · wikipedia: sem chave
    - tavily
    - wikipedia
  resultados_por_busca: 6
  dias_noticias: 90                 # as 3 primeiras buscas olham só notícias dos últimos N dias
  max_paginas: 18                   # páginas baixadas para extrair fatos
  chars_por_pagina: 3500            # trecho de cada página enviado à IA (frases com números)
  chars_por_lote: 11000             # páginas agrupadas por pedido (pequeno para caber nos planos grátis)
  max_fatos: 30

# ---------------- ENTREGA ----------------
entrega:
  release: true                     # publica um Release no GitHub com vídeo, thumbs e textos
  youtube:                          # envio automático (precisa dos Secrets YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN)
    ativo: true
    privacidade: public             # public | unlisted | private (você revisa e publica à mão)
    agendar_hora: "07:30"           # Brasília: sobe privado e fica público sozinho nesse horário; se a rotina atrasar além dele, publica na hora. "" = na hora
    categoria_id: "28"              # 28 = Ciência e tecnologia
  limite_previa_mb: 30              # prévia que abre no celular

midia:                              # fotos e vídeos reais por cena (Wikimedia Commons + Openverse; sem chave)
  ativo: true                       # só licenças que permitem uso comercial e edição (CC0, domínio público, CC BY, CC BY-SA)
  max_cenas: 99                     # limite de cenas com mídia por vídeo; sem candidato ligado à fala, a cena fica sem mídia
  visao: true                       # a IA olha as miniaturas antes de escolher (modelos grátis do OpenRouter; llm.visao.modelos)
  escolha_sem_ver: false            # sem modelo de visão: false = cena sem mídia (garante relevância); true = decide pelo título
  pixabay_sem_visao: true           # sem visão, ainda escolhe entre os do Pixabay pelas tags (que descrevem a imagem)

roteiro:
  critico: true                     # um editor (IA) dá nota a gancho/narrativa/fluidez; abaixo de 7 o roteiro é reescrito
  estilo: viral                     # viral = shorts de conversa, ritmo rápido | educativo = apresentador de jornal financeiro/tecnológico
  notas: ""                         # orientações extras para o roteiro (a pauta do dia costuma preencher)

# ---------------- SÉRIE (episódios em dias alternados) ----------------
# Nos dias da série o curto do dia é o episódio (não sai outro curto); domingo ainda tem o longo semanal.
# Título "Redes na Prática #NN | <título>", capa numerada, paleta fixa e gancho "No próximo vídeo, vamos aprender...".
serie:
  ativo: true
  id: redes
  roteiro_fixo: "roteiros/redes_ep{n:02d}.json"   # episódio só sai com roteiro e cena próprios (engine/videos/); senão, curto normal
  nome: "Redes na Prática"
  inicio: "2026-11-24"
  intervalo_dias: 2                 # um dia sim, outro não
  publico: "técnicos de telecom internos (NOC, suporte) e externos (instalação e manutenção em campo)"
  config:                           # vale só nos episódios
    visual:
      paleta: redes
      cena3d: rota                  # cenário contínuo do caminho da internet (engine/rede3d.js): a câmera percorre as estações
    roteiro:
      estilo: educativo
      cenas_curto: [12, 16]         # mais cenas e mais curtas: cada frase com o seu desenho
      cenas_tecnicas_min: 4         # pelo menos 4 cenas de terminal/topologia/faixa por episódio
      locais_rota: true             # toda cena diz params.local (onde a câmera está no cenário)
      max_numero_repetido: 2        # o mesmo número na tela em no máximo 2 cenas (ep. 1: 0 e -10 dBm o tempo todo)
  referencias: >-                   # valores de referência corretos (entram nas instruções de todo episódio)
    GPON (ITU-T G.984, classe B+): OLT transmite de +1,5 a +5 dBm em 1490 nm (descida); ONU transmite de +0,5 a +5 dBm em
    1310 nm (subida); 1550 nm é vídeo/RF. Potência recebida na ONU: bom entre -8 e -25 dBm (o ideal na prática fica entre
    -15 e -24), atenção entre -25 e -27, crítico abaixo de -27 (sensibilidade -28); acima de -8 satura. -30 dBm na ONU é
    péssimo (quase sem sinal). 0 dBm = 1 mW; -10 dBm = 0,1 mW; -20 dBm = 0,01 mW; cada -3 dB = metade da potência.
    Perdas típicas: splitter 1:2 3,5 dB; 1:4 7,2; 1:8 10,5; 1:16 13,8; 1:32 17,1; 1:64 20,5. Fibra 0,35 dB/km em 1310 e
    0,25 dB/km em 1490/1550. Emenda por fusão 0,05 a 0,1 dB; conector 0,3 a 0,5 dB. Orçamento classe B+: 28 dB; C+: 32 dB. Divisão por porta PON: até 1:128 (ex.: 1:8 na CEO x 1:16 na CTO = 24,3 dB de splitters, exige óptica C+); 1:64 é o limite com B+.
    Wi-Fi (é outra escala, não misture com fibra): -30 a -50 dBm excelente, -67 bom para vídeo, -70 limite, abaixo de -80 ruim.

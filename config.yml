# Configuração do vídeo diário. Tudo aqui pode ser sobrescrito na hora de rodar
# (GitHub → Actions → "Vídeo diário" → Run workflow) ou pela linha de comando:
#   python -m videobot run --tema "chips de IA" --formato curto --narracao edge

# ---------------- TEMA E PESQUISA ----------------
tema:
  nicho: "IA e tecnologia"          # assunto geral do canal (vai no prompt do roteiro)
  tema_fixo: ""                     # se preencher, pula a pesquisa no YouTube e usa este tema
  buscas:                           # mínimo 12 buscas em inglês (o prompt mestre pede ≥12)
    - AI explained animation
    - AI news
    - kinetic typography tech
    - Claude Motion
    - Remotion
    - motion graphics AI
    - AI explained in 60 seconds
    - AI bubble
    - AI agents explained
    - coding animation shorts
    - tech news animated
    - AI data center
    - AI jobs
    - OpenAI news this week
  buscas_extras: []                 # somadas às de cima (ex.: notícias do dia)
  janela_dias: 15                   # CRIVO 1: só vídeos publicados nos últimos N dias
  nao_repetir_dias: 7               # veta tema usado nos últimos N dias (historico/temas.json)
  candidatos_por_busca: 20
  temas_reserva:                    # usados se o YouTube e a API falharem no dia
    - "Quanto de energia a IA realmente gasta"
    - "Agentes de IA: o que já funciona de verdade"
    - "Chips de IA: por que a Nvidia vale tanto"
    - "IA e empregos: o que os dados mostram"
    - "Modelos de IA abertos vs fechados"
    - "Data centers e a conta de luz"
    - "Robôs humanoides: promessa e realidade"

# ---------------- FORMATO ----------------
formato: curto                      # longo (16:9, capítulos) | curto (9:16, Shorts/TikTok)
duracao:
  longo_min: 7                      # alvo em minutos (o prompt aceita 6 a 10)
  curto_seg: 65                     # alvo em segundos (55 a 75)
idioma: pt-BR

# ---------------- NARRAÇÃO (único uso do Gemini por padrão) ----------------
narracao:
  provedor: auto                    # auto = Google AI Studio (Gemini TTS) e, só se falhar, edge-tts | gemini | edge
  gemini_voz: Charon                # Charon (masculina), Kore (feminina), Puck, Fenrir, Aoede, Orus...
  gemini_modelos_preferidos:        # ordem de tentativa; o script também descobre os modelos TTS da sua chave
    - flash-preview-tts
    - flash-tts
    - pro-preview-tts
    - tts
  edge_voz: pt-BR-AntonioNeural     # alternativa: pt-BR-FranciscaNeural
  edge_velocidade: "+10%"
  pronuncia:                        # só muda o que a voz fala; a legenda mantém o termo original
    GPON: Gêpon
    ONU: Ó-Ene-U                    # letra por letra

# ---------------- VISUAL ----------------
visual:
  fps: 30
  paleta: rodizio                   # rodizio = alterna a cada vídeo publicado | laranja | roxo | azul | fixa = usa acento/acento2 abaixo
  paletas:                          # cores de cada paleta (acento = principal, acento2 = legenda ativa, acento_suave = barra de progresso)
    laranja:
      acento: "#ff4f12"
      acento2: "#d4ff3a"
      acento_suave: "#ff8a52"
    roxo:                           # roxo cibernético
      acento: "#a64dff"
      acento2: "#3df5ff"
      acento_suave: "#c993ff"
    azul:                           # azul cibernético
      acento: "#1f8bff"
      acento2: "#ff4fd8"
      acento_suave: "#6cb6ff"
  acento: "#ff4f12"                 # laranja (cor principal; só vale com paleta: fixa)
  acento2: "#d4ff3a"                # volt (destaques e legenda ativa; só vale com paleta: fixa)
  marca: ""                         # texto discreto no canto (ex.: @seucanal); vazio = nada
  marca_logo: "assets/logo_marca.png"  # marca d'água em imagem (PNG transparente); vazio = sem logo
  marca_opacidade: 0.5              # 0 a 1; 0.5 = discreta
  marca_troca_s: 9                  # a logo troca de canto a cada N segundos
  cena3d: "gpon"                    # "gpon" = fundo 3D em código (Three.js: cidade, fibra, OLT e ONU); vazio = fundo 2D
  escala3d: 0.75                    # resolução interna do 3D (menor = render mais rápido)
  legendas: true
  musica: true                      # trilha gerada em código, baixinha por baixo da voz
  efeitos: true                     # whoosh/pop gerados em código
  workers: 0                        # 0 = um por núcleo de CPU

# ---------------- TEXTO: triagem, fatos e roteiro (IAs grátis) ----------------
# Cada provedor precisa da sua chave no ambiente (GitHub: Secrets; PC: setx). Sem chave, ele é pulado.
#   groq → GROQ_API_KEY (console.groq.com) · openrouter → OPENROUTER_API_KEY (openrouter.ai, só modelos :free)
#   gemini → GEMINI_API_KEY (opcional; por padrão o Gemini fica só com a voz)
llm:
  ordem:                            # provedores tentados em ordem; se um esgota a cota, passa para o próximo
    - groq
    - openrouter
  groq:
    modelos:                        # preferidos primeiro (nome ou trecho do nome); depois os outros da sua chave
      - gpt-oss-120b
      - qwen
      - gpt-oss-20b
  openrouter:
    modelos:                        # só os gratuitos (:free) entram; os gigantes grátis costumam travar, por isso vêm depois
      - nemotron-3-nano
      - gemma-4
      - gpt-oss
      - deepseek
  gemini:
    modelos:                        # só é usado para texto se "gemini" estiver na ordem acima
      - gemini-3.8-flash
      - flash
  modelos_por_provedor: 4           # quantos modelos de cada provedor tentar antes de passar ao próximo
  max_tokens: 8000                  # tamanho máximo da resposta
  espera_max_s: 65                  # se a cota pede para esperar mais que isso, pula o modelo
  min_fontes: 3                     # CRIVO 3: fontes confiáveis distintas, conferidas por download

# ---------------- BUSCA NA WEB (fontes dos fatos) ----------------
busca:
  provedores:                       # só APIs oficiais. tavily: TAVILY_API_KEY (tavily.com) · wikipedia: sem chave
    - tavily
    - wikipedia
  resultados_por_busca: 6
  dias_noticias: 90                 # as 3 primeiras buscas olham só notícias dos últimos N dias
  max_paginas: 18                   # páginas baixadas para extrair fatos
  chars_por_pagina: 3500            # trecho de cada página enviado à IA (frases com números)
  chars_por_lote: 11000             # páginas agrupadas por pedido (pequeno para caber nos planos grátis)
  max_fatos: 30

# ---------------- ENTREGA ----------------
entrega:
  release: true                     # publica um Release no GitHub com vídeo, thumbs e textos
  limite_previa_mb: 30              # prévia que abre no celular
